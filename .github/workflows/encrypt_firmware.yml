name: Encrypt firmware
on:
  repository_dispatch:
    types: [firmware_encrypt]

env:
  DFU_USER_CONFIG: oniimaiv3_config.h
  MACRO_NAME_KEY: ACT_SECRET_KEY
  MACRO_NAME_IV: ACT_SECRET_IV

jobs:
  encrypt:
    name: Build crypter and encrypt
    env:
      CMSIS: CMSIS_5
    runs-on: ubuntu-latest
    steps:
    - name: Install GNU Arm Embedded Toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1.10.1

    - name: Checkout
      uses: actions/checkout@v2

    - name: Resolve prerequisites
      run: make prerequisites

    - name: Append Key and IV to header
      run: |
        echo "" >> ${{ env.DFU_USER_CONFIG }}
        echo "// Generated by Github Actions" >> ${{ env.DFU_USER_CONFIG }}
        echo "#define ${{ env.MACRO_NAME_KEY}} $(echo ${{ secrets.FIRMWARE_ENC_KEY }} | sed 's/../0x&, /g' | sed 's/, $//')" >> ${{ env.DFU_USER_CONFIG }}
        echo "#define ${{ env.MACRO_NAME_IV}} $(echo ${{ secrets.FIRMWARE_ENC_IV }} | sed 's/../0x&, /g' | sed 's/, $//')" >> ${{ env.DFU_USER_CONFIG }}

    - name: Build crypter
      run: make DFU_USER_CONFIG=${{ env.DFU_USER_CONFIG }} crypter

    - name: Download App artifact
      uses: dawidd6/action-download-artifact@v3
      with:
        repo: ${{ github.event.client_payload.repo }}
        path: ${{ github.workspace }}/firmwares
        run_id: ${{ github.event.client_payload.run_id }}
        name: ${{ github.event.client_payload.artifact }}
        github_token: ${{ secrets.ENCRYPT_PAT }}

    - name: Encrypt firmware
      run: |
        mkdir -p encrypted
        for f in ./firmwares/*.bin; do
          out="encrypted/$(basename "$f")"
          ${{ github.workspace }}/build/fwcrypt -e -i "$f" -o "$out"
        done

    - name: Upload encrypted firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.client_payload.artifact }}
        path: ${{ github.workspace }}/encrypted/*.bin
        
    - name: Trigger workflow after encryption
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.ENCRYPT_PAT }}
        repository: ${{ github.event.client_payload.repo }}
        event-type: firmware_encrypt_done
        client-payload: |
          {
            "repo": "${{ github.repository }}",
            "run_id": ${{ github.run_id }},
            "artifact": "${{ github.event.client_payload.artifact }}",
            "tag": "${{ github.event.client_payload.tag }}"
          }